
name: Grade 7 English Exam Countdown

on:
  schedule:
       - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  countdown:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Download bot files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      
      - name: Update Telegram countdown
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_ID: ${{ vars.MESSAGE_ID }}
        run: python bot.py

